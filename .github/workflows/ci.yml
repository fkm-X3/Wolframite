name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run all tests
        run: zig build test

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build ore (linux x86_64)
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline -Dgit-sha=${{ github.sha }}

      - name: Build ore (windows x86_64)
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline -Dtarget=x86_64-windows -p zig-out-win -Dgit-sha=${{ github.sha }}

      - name: Stage release assets
        run: |
          mkdir -p dist
          # Package Linux output (bin/ and lib/) into tar.gz
          tar -czf dist/ore-linux-x86_64.tar.gz -C zig-out .
          
          # Package Windows output (bin/ and lib/) into zip
          (cd zig-out-win && zip -r ../dist/ore-windows-x86_64.zip .)

      - name: Clobber dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete dev --yes --cleanup-tag || true

      - name: Publish dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create dev \
            --prerelease \
            --title "dev build (${{ github.sha }})" \
            --notes "Automated development build from commit \`${{ github.sha }}\`. Install or update with: \`ore update\`" \
            dist/ore-linux-x86_64.tar.gz dist/ore-windows-x86_64.zip