name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run compiler tests
        run: zig build test-compiler
